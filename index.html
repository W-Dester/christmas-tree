<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#03010a" />
<title>Merry Christmas</title>
<meta name="description" content="a little tree of light, just for you" />
<meta property="og:title" content="Merry Christmas" />
<meta property="og:description" content="a little tree of light, just for you" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #03010a; overflow: hidden; }
  body {
    position: fixed; inset: 0; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; -moz-user-select: none; user-select: none;
  }
  #c { display: block; width: 100%; height: 100%; }
  .fade {
    position: fixed; inset: 0; pointer-events: none;
    background: #03010a; opacity: 1;
    transition: opacity 1.15s ease;
  }
  .fade.out { opacity: 0; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 36%, rgba(0,0,0,.62) 100%);
  }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center; pointer-events: none;
    color: rgba(255,255,255,.26);
    font: 400 11px/1 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    letter-spacing: .24em; opacity: 0; transition: opacity 1.1s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="fade" id="fade"></div>
<div class="hint" id="hint">TAP TO REPLAY</div>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d', { alpha: false });
  var hint = document.getElementById('hint');

  var FONT_STACK = '"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif';

  // 主配色（粉白光感）
  var PALETTE = [
    { rgb: '255,108,178', w: 0.31 },  // 亮粉
    { rgb: '255,208,232', w: 0.26 },  // 浅粉
    { rgb: '255,255,255', w: 0.28 },  // 白
    { rgb: '188,142,255', w: 0.10 },  // 紫
    { rgb: '160,214,255', w: 0.05 }   // 冷蓝
  ];
  var STAR_RGB = '255,224,140';       // 树尖金星

  /* ---------------- 设备性能分级（决定像素密度与粒子预算） ---------------- */
  var UA_MOBILE = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent);
  var CORES = navigator.hardwareConcurrency || 4;
  var MEM = navigator.deviceMemory || 4;
  var PERF = (CORES <= 4 || MEM <= 2) ? 0 : (UA_MOBILE ? 1 : 2); // 0低 1中 2高
  var DPR_CAP = [1.3, 1.75, 2][PERF];
  var PART_MAX = [1000, 1400, 4200][PERF];
  var STAR_MAX = [150, 230, 340][PERF];
  var DUST_MAX = [22, 34, 46][PERF];
  var SNOW_MAX = [48, 68, 90][PERF];

  var DPR = 1, W = 0, H = 0, cx = 0, cy = 0, focal = 800;
  var sprites = [], starSprite = null;
  var stars = [], dust = [], snow = [], parts = [], starPts = [];
  var textT = [], treeT = [], treeH = 0, treeR = 0;

  // 爱心相关
  var hearts3D = [], heartsUp = [], bursts = [], heartImgs = [];
  var meteors = [], nextMeteorAt = 5.5, meteorSprite = null;
  var HEART_RGB = ['255,92,160', '255,168,214', '255,236,246'];
  var heartOn = location.hash.indexOf('noheart') < 0;

  var now = 0, last = 0, rotY = 0, bornAt = 0;
  var fCount = 0, fAcc = 0, fN = 0, fChecked = false;
  var stageIdx = 0, stageStart = 0;
  var STAGES = [{ type: 'tree', hold: 1e9 }];
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- 发光贴图 ---------------- */
  function makeSprite(rgb) {
    var S = 64;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0.00, 'rgba(255,255,255,1)');
    gr.addColorStop(0.14, 'rgba(' + rgb + ',0.96)');
    gr.addColorStop(0.40, 'rgba(' + rgb + ',0.30)');
    gr.addColorStop(1.00, 'rgba(' + rgb + ',0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, S, S);
    return c;
  }

  /* ---------------- 心形贴图 ---------------- */
  function heartPath(g, ox, oy, R) {
    g.beginPath();
    for (var i = 0; i <= 72; i++) {
      var t = i / 72 * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var px = ox + hx / 17 * R;
      var py = oy - hy / 17 * R - R * 0.06;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
  }

  function makeHeartSprite(rgb) {
    var S = 128;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    var R = S * 0.40;
    heartPath(g, S / 2, S / 2, R);
    var gr = g.createRadialGradient(S / 2, S * 0.44, 0, S / 2, S * 0.52, R * 1.2);
    gr.addColorStop(0.00, 'rgba(255,255,255,0.80)');
    gr.addColorStop(0.42, 'rgba(' + rgb + ',0.52)');
    gr.addColorStop(1.00, 'rgba(' + rgb + ',0.14)');
    g.fillStyle = gr;
    g.fill();
    g.lineJoin = 'round';
    g.lineWidth = S * 0.048;
    g.shadowColor = 'rgba(' + rgb + ',1)';
    g.shadowBlur = S * 0.24;
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.stroke();
    g.stroke();
    return c;
  }

  function pickColorIndex() {
    var r = Math.random(), acc = 0;
    for (var i = 0; i < PALETTE.length; i++) {
      acc += PALETTE[i].w;
      if (r <= acc) return i;
    }
    return 0;
  }

  /* ---------------- 背景 ---------------- */
  function buildStars() {
    stars = [];
    var n = Math.min(STAR_MAX, Math.round(W * H / 5400));
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.35 + Math.random() * 1.2,
        a: 0.16 + Math.random() * 0.5,
        sp: 0.35 + Math.random() * 1.7,
        ph: Math.random() * 6.2832,
        img: sprites[Math.random() < 0.78 ? 2 : (Math.random() < 0.6 ? 4 : 3)]
      });
    }
  }

  function buildDust() {
    dust = [];
    var n = Math.min(DUST_MAX, Math.round(W * H / 42000));
    for (var i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1.4 + Math.random() * 5.2,
        vx: (Math.random() - 0.5) * 7,
        vy: -(3 + Math.random() * 12),
        a: 0.035 + Math.random() * 0.11,
        ph: Math.random() * 6.2832,
        ci: Math.random() < 0.62 ? 0 : 1
      });
    }
  }

  function buildSnow() {
    snow = [];
    var n = Math.min(SNOW_MAX, Math.round(W * H / 9000));
    for (var i = 0; i < n; i++) {
      snow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.9 + Math.random() * 2.1,
        vy: 12 + Math.random() * 34,
        vx: (Math.random() - 0.5) * 9,
        a: 0.22 + Math.random() * 0.5,
        ph: Math.random() * 6.2832
      });
    }
  }

  /* ---------------- 文字采样 ---------------- */
  function measureFontSize(lines, maxW, maxH) {
    var fs = 140;
    ctx.font = '600 ' + fs + 'px ' + FONT_STACK;
    var w = 0;
    for (var i = 0; i < lines.length; i++) w = Math.max(w, ctx.measureText(lines[i]).width);
    if (w <= 0) return fs;
    fs = fs * (maxW / w);
    var totalH = fs * 1.26 * lines.length;
    if (totalH > maxH) fs = fs * (maxH / totalH);
    return fs;
  }

  function sampleText() {
    var portrait = H > W * 1.02;
    var lines = portrait ? ['zxh,', 'I love you'] : ['zxh, I love you'];

    var maxW = W * (portrait ? 0.70 : 0.66);
    var maxH = H * (portrait ? 0.34 : 0.46);
    var fs = measureFontSize(lines, maxW, maxH);

    var off = document.createElement('canvas');
    off.width = Math.max(2, Math.floor(W));
    off.height = Math.max(2, Math.floor(H));
    var g = off.getContext('2d');
    g.fillStyle = '#ffffff';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '600 ' + fs + 'px ' + FONT_STACK;

    var lineH = fs * 1.26;
    var startY = H / 2 - (lines.length - 1) * lineH / 2 - fs * 0.03;
    for (var i = 0; i < lines.length; i++) g.fillText(lines[i], W / 2, startY + i * lineH);

    var img = g.getImageData(0, 0, off.width, off.height).data;
    var step = Math.max(2, Math.round(fs / 48));
    var raw = [];
    for (var y = 0; y < off.height; y += step) {
      for (var x = 0; x < off.width; x += step) {
        if (img[(y * off.width + x) * 4 + 3] > 128) raw.push(x, y);
      }
    }

    var MAX = PART_MAX;
    var count = raw.length / 2;
    var kept = [];
    var k;
    if (count > MAX) {
      var idx = [];
      for (k = 0; k < count; k++) idx.push(k);
      for (var m = 0; m < MAX; m++) {
        var j = m + Math.floor(Math.random() * (count - m));
        var tmp = idx[m]; idx[m] = idx[j]; idx[j] = tmp;
        kept.push(idx[m]);
      }
    } else {
      for (k = 0; k < count; k++) kept.push(k);
    }

    var thick = fs * 0.5;
    window.__dbg = { W: W, H: H, fs: Math.round(fs * 10) / 10, maxW: Math.round(maxW), raw: count, kept: kept.length };
    if (location.hash.indexOf('dbg') >= 0) {
      document.title = 'DBG W=' + W + ' H=' + H + ' fs=' + Math.round(fs * 10) / 10 +
        ' maxW=' + Math.round(maxW) + ' raw=' + count + ' kept=' + kept.length;
    }
    var out = [];
    for (var n = 0; n < kept.length; n++) {
      var p = kept[n];
      out.push({
        x: raw[p * 2] - W / 2 + (Math.random() - 0.5) * 0.9,
        y: raw[p * 2 + 1] - H / 2 + (Math.random() - 0.5) * 0.9,
        z: (Math.random() - 0.5) * thick
      });
    }

    // 按采样点真实范围做安全缩放，保证 3D 旋转 + 发光后不溢出屏幕
    var maxAbsX = 0, maxAbsY = 0;
    for (var q = 0; q < out.length; q++) {
      var ax = Math.abs(out[q].x), ay = Math.abs(out[q].y);
      if (ax > maxAbsX) maxAbsX = ax;
      if (ay > maxAbsY) maxAbsY = ay;
    }
    if (maxAbsX > 0 && maxAbsY > 0) {
      var limX = W * 0.5 - 22;
      var limY = H * 0.5 - 22;
      var sc = Math.min(1, limX / (maxAbsX * 1.28), limY / (maxAbsY * 1.12));
      if (sc < 1) {
        for (var r = 0; r < out.length; r++) {
          out[r].x *= sc; out[r].y *= sc; out[r].z *= sc;
        }
      }
      if (window.__dbg) {
        window.__dbg.maxX = Math.round(maxAbsX * Math.min(1, sc));
        window.__dbg.maxY = Math.round(maxAbsY * Math.min(1, sc));
        window.__dbg.sc = Math.round(sc * 100) / 100;
      }
    }
    return out;
  }

  /* ---------------- 圣诞树采样 ---------------- */
  function sampleTree(n) {
    var out = [];
    var turns = 13.0;
    for (var i = 0; i < n; i++) {
      var u = (i + 0.5) / n;                       // 0 = 底, 1 = 顶
      var y0 = treeH / 2 - u * treeH;              // 屏幕 y 向下
      var rad = treeR * Math.pow(1 - u, 0.9);
      var a, r;
      if (Math.random() < 0.6) {                   // 螺旋灯带
        a = u * turns * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
        r = rad * (0.93 + Math.random() * 0.12);
      } else {                                     // 树体表面
        a = Math.random() * Math.PI * 2;
        r = rad * (0.74 + 0.26 * Math.random());
      }
      out.push({
        x: Math.cos(a) * r,
        y: y0 + (Math.random() - 0.5) * treeH * 0.014,
        z: Math.sin(a) * r
      });
    }
    return out;
  }

  function starShape(n, ox, oy, R) {
    var out = [];
    var seg = Math.PI * 2 / 5;
    for (var i = 0; i < n; i++) {
      var a = i / n * Math.PI * 2 - Math.PI / 2;
      var ph = ((a + Math.PI) % seg + seg) % seg / seg;
      var rr = R * (0.44 + 0.56 * (1 - Math.abs(2 * ph - 1)));
      out.push({
        x: ox + Math.cos(a) * rr,
        y: oy + Math.sin(a) * rr,
        z: (Math.random() - 0.5) * R * 0.5
      });
    }
    return out;
  }

  /* ---------------- 爱心构建 ---------------- */
  function newUpHeart(spread) {
    return {
      x: W * 0.10 + Math.random() * W * 0.80,
      y: spread ? Math.random() * H : H + 18 + Math.random() * 60,
      r: treeH * (0.011 + Math.random() * 0.013),
      vy: -(treeH * 0.055 + Math.random() * treeH * 0.055),
      sw: 8 + Math.random() * 26,
      sp: 0.35 + Math.random() * 0.7,
      ph: Math.random() * 6.2832,
      a: 0.28 + Math.random() * 0.42,
      ci: Math.random() < 0.62 ? 0 : (Math.random() < 0.7 ? 1 : 2)
    };
  }

  function buildHearts() {
    hearts3D = [];
    var n = 9;
    for (var i = 0; i < n; i++) {
      var u = 0.10 + 0.78 * (i / Math.max(1, n - 1)) + (Math.random() - 0.5) * 0.06;
      if (u < 0.06) u = 0.06;
      if (u > 0.92) u = 0.92;
      var rad = treeR * Math.pow(1 - u, 0.9) * (1.10 + Math.random() * 0.20);
      hearts3D.push({
        ang: Math.random() * Math.PI * 2,
        rad: rad,
        y: treeH / 2 - u * treeH,
        size: treeH * (0.038 + Math.random() * 0.024),
        ph: Math.random() * 6.2832,
        sp: 0.55 + Math.random() * 0.6,
        ci: i % 3 === 0 ? 2 : (i % 3 === 1 ? 0 : 1),
        orbit: 0.14 + Math.random() * 0.16
      });
    }

    heartsUp = [];
    var m = Math.max(6, Math.min(16, Math.round(W * H / 62000)));
    for (var k = 0; k < m; k++) heartsUp.push(newUpHeart(true));
    bursts = [];
  }

  function makeMeteorSprite() {
    var MW = 128, MH = 16;
    var c = document.createElement('canvas');
    c.width = MW; c.height = MH;
    var g = c.getContext('2d');
    var gr = g.createLinearGradient(MW, 0, 0, 0);
    gr.addColorStop(0.00, 'rgba(255,255,255,0.95)');
    gr.addColorStop(0.16, 'rgba(255,228,242,0.58)');
    gr.addColorStop(0.55, 'rgba(255,206,234,0.14)');
    gr.addColorStop(1.00, 'rgba(255,206,234,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, MW, MH);
    return c;
  }

  function spawnMeteor() {
    var span = Math.max(W, H);
    var fromLeft = Math.random() < 0.5;
    meteors.push({
      x: fromLeft ? -span * 0.10 : W + span * 0.10,
      y: H * (0.04 + Math.random() * 0.34),
      vx: (fromLeft ? 1 : -1) * span * (0.46 + Math.random() * 0.22),
      vy: span * (0.17 + Math.random() * 0.11),
      len: 0.075 + Math.random() * 0.045,
      life: 0,
      max: 1.25 + Math.random() * 0.55,
      a: 0.45 + Math.random() * 0.35
    });
  }

  function spawnBurst() {
    if (!heartOn) return;
    var n = 24;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = treeH * (0.10 + Math.random() * 0.34);
      bursts.push({
        x: cx + Math.cos(a) * treeR * 0.3,
        y: cy + Math.sin(a) * treeR * 0.3,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - treeH * 0.07,
        r: treeH * (0.009 + Math.random() * 0.014),
        life: 0,
        max: 1.0 + Math.random() * 0.7,
        ci: Math.random() < 0.6 ? 0 : (Math.random() < 0.7 ? 1 : 2)
      });
    }
  }

  /* ---------------- 构建 ---------------- */
  function buildTargets() {
    textT = sampleText();
    treeH = Math.min(H * 0.70, W * 0.80);
    treeR = Math.min(treeH * 0.31, W * 0.23);
    treeT = sampleTree(textT.length);
    starPts = starShape(46, 0, -treeH / 2 - treeH * 0.072, treeH * 0.062);
    buildStars();
    buildDust();
    buildSnow();
    buildHearts();
  }

  function initParticles(instant) {
    parts = [];
    var R0 = Math.max(W, H);
    for (var i = 0; i < textT.length; i++) {
      var t = textT[i];
      var a = Math.random() * Math.PI * 2;
      var R = R0 * (0.62 + Math.random() * 0.8);
      parts.push({
        fx: Math.cos(a) * R,
        fy: Math.sin(a) * R * 0.82,
        fz: (Math.random() - 0.5) * R0 * 0.9,
        tx: t.x, ty: t.y, tz: t.z,
        t0: instant ? (now - 10) : (now + Math.random() * 0.85),
        dur: 1.9,
        sz: 0.42 + Math.random() * 0.52,
        alpha: 0.62 + Math.random() * 0.38,
        ph: Math.random() * 6.2832,
        ci: pickColorIndex()
      });
    }
  }

  /* ---------------- 阶段切换 ---------------- */
  function applyStage(type, quick) {
    var tgt = (type === 'text') ? textT : treeT;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], t = tgt[i];
      if (!t) continue;
      p.fx = p.tx; p.fy = p.ty; p.fz = p.tz;
      p.tx = t.x; p.ty = t.y; p.tz = t.z;
      p.t0 = now + Math.random() * 0.35;
      p.dur = quick ? 0.9 : 1.5;
    }
  }

  /* ---------------- 重播 / 提示 ---------------- */
  var hintTimer = null;
  function flashHint() {
    hint.style.opacity = '0.55';
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.style.opacity = '0'; }, 1600);
  }

  function replay() {
    stageIdx = 0;
    stageStart = now + 0.25;
    var R0 = Math.max(W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var a = Math.random() * Math.PI * 2;
      var R = R0 * (0.62 + Math.random() * 0.8);
      p.fx = Math.cos(a) * R;
      p.fy = Math.sin(a) * R * 0.82;
      p.fz = (Math.random() - 0.5) * R0 * 0.9;
      p.tx = treeT[i] ? treeT[i].x : 0;
      p.ty = treeT[i] ? treeT[i].y : 0;
      p.tz = treeT[i] ? treeT[i].z : 0;
      p.t0 = now + Math.random() * 0.85;
      p.dur = 1.9;
    }
    rotY = 0;
    spawnBurst();
    flashHint();
  }

  /* ---------------- 主循环 ---------------- */
  function render(ts) {
    now = ts / 1000;
    var g = now;
    var dt = Math.min(0.05, last ? now - last : 0.016);
    last = now;

    // 自适应画质：启动后若持续低于约 42fps，则一次性降低像素密度
    if (!fChecked) {
      fCount++;
      if (fCount > 20) { fAcc += dt; fN++; }
      if (fCount >= 80) {
        fChecked = true;
        if (fN > 0 && (fAcc / fN) > 0.024 && DPR_CAP > 1.35) {
          DPR_CAP = 1.35;
          resize();
        }
      }
    }

    // 阶段推进
    if (g - stageStart > STAGES[stageIdx].hold) {
      stageIdx = (stageIdx + 1) % STAGES.length;
      stageStart = g;
      applyStage(STAGES[stageIdx].type, false);
    }
    var isTree = (STAGES[stageIdx].type === 'tree');
    var treeMix = isTree
      ? Math.min(1, Math.max(0, (g - stageStart) / 1.4))
      : Math.max(0, 1 - Math.max(0, (g - stageStart) / 1.4));

    var i, s, r, tw, d;

    // 残影
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(3,1,10,0.34)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // 地面光晕
    if (treeMix > 0.02) {
      var gyy = cy + treeH * 0.50;
      var grx = treeR * 2.30;
      var gry = treeR * 0.46;
      ctx.globalAlpha = 0.10 * treeMix * (0.85 + 0.15 * Math.sin(g * 0.9));
      ctx.drawImage(sprites[0], cx - grx, gyy - gry, grx * 2, gry * 2);
      ctx.globalAlpha = 0.055 * treeMix;
      ctx.drawImage(sprites[1], cx - grx * 0.58, gyy - gry * 0.5, grx * 1.16, gry);
    }

    // 星空
    for (i = 0; i < stars.length; i++) {
      s = stars[i];
      tw = 0.22 + 0.78 * Math.abs(Math.sin(g * s.sp + s.ph));
      r = s.r * (2.4 + 1.6 * tw);
      ctx.globalAlpha = tw * s.a;
      ctx.drawImage(s.img, s.x - r, s.y - r, r * 2, r * 2);
    }

    // 浮尘
    for (i = 0; i < dust.length; i++) {
      d = dust[i];
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      if (d.y < -20) { d.y = H + 20; d.x = Math.random() * W; }
      if (d.x < -20) d.x = W + 20;
      if (d.x > W + 20) d.x = -20;
      r = d.r * (2.0 + 0.7 * Math.sin(g * 0.8 + d.ph));
      ctx.globalAlpha = d.a * (0.7 + 0.3 * Math.sin(g * 0.6 + d.ph));
      ctx.drawImage(sprites[d.ci], d.x - r, d.y - r, r * 2, r * 2);
    }

    // ---- 流星 ----
    if (g > nextMeteorAt) {
      spawnMeteor();
      nextMeteorAt = g + 7 + Math.random() * 9;
    }
    for (i = meteors.length - 1; i >= 0; i--) {
      var mt = meteors[i];
      mt.life += dt;
      if (mt.life > mt.max) { meteors.splice(i, 1); continue; }
      mt.x += mt.vx * dt;
      mt.y += mt.vy * dt;
      var lf = mt.life / mt.max;
      var mfade = Math.sin(Math.PI * Math.min(1, lf)) * mt.a;
      var tlen = Math.max(W, H) * mt.len;
      ctx.globalAlpha = mfade;
      ctx.save();
      ctx.translate(mt.x, mt.y);
      ctx.rotate(Math.atan2(mt.vy, mt.vx));
      ctx.drawImage(meteorSprite, -tlen, -3.4, tlen, 6.8);
      ctx.restore();
    }

    // ---- 3D 旋转参数 ----
    var spin = reduceMotion ? 0.18 : (isTree ? 0.56 : 0.62);
    rotY += spin * dt * (0.85 + 0.3 * Math.sin(g * 0.24));
    var cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    var tilt = -0.09;
    var cosX = Math.cos(tilt), sinX = Math.sin(tilt);
    var breath = 1 + Math.sin(g * 0.85) * 0.013;
    var bob = isTree ? Math.sin(g * 0.9) * treeH * 0.008 : 0;

    // ---- 主粒子 ----
    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      var k = (g - p.t0) / p.dur;
      if (k < 0) k = 0; else if (k > 1) k = 1;
      var e = 1 - Math.pow(1 - k, 3);

      var jit = 0.85 * e;
      var px = (p.fx + (p.tx - p.fx) * e) + Math.sin(g * 1.55 + p.ph) * jit;
      var py = (p.fy + (p.ty - p.fy) * e) + Math.cos(g * 1.35 + p.ph * 1.27) * jit + bob;
      var pz = p.fz + (p.tz - p.fz) * e;

      px *= breath;
      py *= breath;

      var x1 = px * cosY - pz * sinY;
      var z1 = px * sinY + pz * cosY;
      var y1 = py * cosX - z1 * sinX;
      var z2 = py * sinX + z1 * cosX;

      var persp = focal / (focal + z2);
      if (persp <= 0.08) continue;

      var sx = cx + x1 * persp;
      var sy = cy + y1 * persp;
      if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;

      var al = (persp - 0.52) / 0.72;
      if (al < 0.04) al = 0.04; else if (al > 1) al = 1;

      var rr = p.sz * persp * 3.1;
      ctx.globalAlpha = al * p.alpha * (0.45 + 0.55 * e);
      ctx.drawImage(sprites[p.ci], sx - rr, sy - rr, rr * 2, rr * 2);
    }

    // ---- 爱心 ----
    if (heartOn && treeMix > 0.02) {
      var depthA, hs, hal;

      // 树上 3D 心形挂饰
      for (i = 0; i < hearts3D.length; i++) {
        var hp = hearts3D[i];
        var ha = hp.ang + rotY * hp.orbit + g * 0.14;
        var hx0 = Math.cos(ha) * hp.rad;
        var hz0 = Math.sin(ha) * hp.rad;
        var hy0 = hp.y + Math.sin(g * hp.sp + hp.ph) * treeH * 0.011;
        hx0 *= breath;
        hy0 *= breath;
        var hX = hx0 * cosY - hz0 * sinY;
        var hZ = hx0 * sinY + hz0 * cosY;
        var hY = hy0 * cosX - hZ * sinX;
        var hZ2 = hy0 * sinX + hZ * cosX;
        var hpr = focal / (focal + hZ2);
        if (hpr <= 0.1) continue;
        hs = hp.size * hpr * (0.92 + 0.16 * Math.sin(g * 2.1 + hp.ph));
        depthA = (hpr - 0.76) / 0.42;
        if (depthA < 0.42) depthA = 0.42; else if (depthA > 1) depthA = 1;
        hal = depthA * treeMix * (0.70 + 0.30 * Math.sin(g * 1.9 + hp.ph * 1.3));
        ctx.globalAlpha = Math.max(0.10, hal);
        ctx.drawImage(heartImgs[hp.ci], cx + hX * hpr - hs, cy + hY * hpr - hs, hs * 2, hs * 2);
      }

      // 飘升爱心
      for (i = 0; i < heartsUp.length; i++) {
        var hu = heartsUp[i];
        hu.y += hu.vy * dt;
        hu.x += Math.sin(g * hu.sp + hu.ph) * hu.sw * dt;
        if (hu.y < -hu.r * 4 || hu.x < -hu.r * 8 || hu.x > W + hu.r * 8) {
          heartsUp[i] = newUpHeart(false);
          continue;
        }
        var yr = hu.y / H;
        var fa = Math.min(1, yr * 5.2) * Math.min(1, (1 - yr) * 3.0);
        if (fa <= 0.012) continue;
        ctx.globalAlpha = hu.a * fa * treeMix * (0.62 + 0.38 * Math.sin(g * 2.2 + hu.ph));
        ctx.drawImage(heartImgs[hu.ci], hu.x - hu.r, hu.y - hu.r, hu.r * 2, hu.r * 2);
      }

      // 点击爆发的爱心
      for (i = bursts.length - 1; i >= 0; i--) {
        var bu = bursts[i];
        bu.life += dt;
        if (bu.life >= bu.max) { bursts.splice(i, 1); continue; }
        bu.x += bu.vx * dt;
        bu.y += bu.vy * dt;
        bu.vx *= (1 - 1.7 * dt);
        bu.vy = bu.vy * (1 - 1.7 * dt) + treeH * 0.10 * dt;
        var bl = 1 - bu.life / bu.max;
        var br = bu.r * (0.65 + 0.55 * bl);
        ctx.globalAlpha = Math.max(0, bl * bl * 0.9);
        ctx.drawImage(heartImgs[bu.ci], bu.x - br, bu.y - br, br * 2, br * 2);
      }
    }

    // ---- 树尖金星 ----
    if (treeMix > 0.02) {
      var sY0 = -treeH / 2 - treeH * 0.072 + bob;
      var sZ0 = sY0 * sinX;
      var sPr0 = focal / (focal + sZ0);
      var sR0 = treeH * 0.112 * sPr0 * (0.90 + 0.10 * Math.sin(g * 1.7));
      ctx.globalAlpha = 0.19 * treeMix;
      ctx.drawImage(starSprite, cx - sR0, cy + sY0 * cosX * sPr0 - sR0, sR0 * 2, sR0 * 2);

      for (i = 0; i < starPts.length; i++) {
        var sp = starPts[i];
        var sx2 = sp.x, sy2 = sp.y + bob, sz2 = sp.z;
        var ax = sx2 * cosY - sz2 * sinY;
        var az = sx2 * sinY + sz2 * cosY;
        var ay = sy2 * cosX - az * sinX;
        var az2 = sy2 * sinX + az * cosX;
        var pr = focal / (focal + az2);
        var rr2 = 2.6 * pr * (0.85 + 0.25 * Math.sin(g * 3.1 + i));
        ctx.globalAlpha = Math.min(1, treeMix) * (0.75 + 0.25 * Math.sin(g * 2.6 + i * 0.7));
        ctx.drawImage(starSprite, cx + ax * pr - rr2, cy + ay * pr - rr2, rr2 * 2, rr2 * 2);
      }
    }

    // ---- 雪花 ----
    if (treeMix > 0.02) {
      for (i = 0; i < snow.length; i++) {
        var sn = snow[i];
        sn.y += sn.vy * dt;
        sn.x += (sn.vx + Math.sin(g * 0.8 + sn.ph) * 8) * dt;
        if (sn.y > H + 12) { sn.y = -12; sn.x = Math.random() * W; }
        if (sn.x < -12) sn.x = W + 12;
        if (sn.x > W + 12) sn.x = -12;
        r = sn.r * 2.6;
        ctx.globalAlpha = sn.a * treeMix * (0.55 + 0.45 * Math.sin(g * 1.6 + sn.ph));
        ctx.drawImage(sprites[2], sn.x - r, sn.y - r, r * 2, r * 2);
      }
    }

    ctx.globalAlpha = 1;
    if (location.hash.indexOf('hud') >= 0 && window.__dbg) {
      var db = window.__dbg;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('W=' + db.W + ' H=' + db.H, 12, 26);
      ctx.fillText('fs=' + db.fs + ' kept=' + db.kept, 12, 50);
      ctx.fillText('maxX=' + db.maxX + ' maxY=' + db.maxY + ' sc=' + db.sc, 12, 74);
      ctx.fillText('perf=' + PERF + ' dpr=' + DPR.toFixed(2) + ' deg=' + (DPR_CAP > 1.4 ? 0 : 1), 12, 98);
      ctx.fillText('parts=' + parts.length + ' stars=' + stars.length + ' snow=' + snow.length +
        ' met=' + meteors.length, 12, 122);
      ctx.globalCompositeOperation = 'lighter';
    }
    requestAnimationFrame(render);
  }

  /* ---------------- 尺寸 ---------------- */
  var rzTimer = null;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    W = Math.max(2, window.innerWidth);
    H = Math.max(2, window.innerHeight);
    cx = W / 2;
    cy = H / 2;
    focal = Math.max(W, H) * 1.9;

    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#03010a';
    ctx.fillRect(0, 0, W, H);

    var prevStage = STAGES[stageIdx].type;
    buildTargets();
    if (location.hash.indexOf('clean') >= 0) { stars = []; dust = []; snow = []; }
    initParticles(true);
    if (prevStage === 'tree') {
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i], t = treeT[i];
        if (!t) continue;
        p.tx = t.x; p.ty = t.y; p.tz = t.z;
        p.t0 = now - 10;
      }
    }
  }

  /* ---------------- 启动 ---------------- */
  sprites = PALETTE.map(function (c) { return makeSprite(c.rgb); });
  starSprite = makeSprite(STAR_RGB);
  heartImgs = HEART_RGB.map(function (rgb) { return makeHeartSprite(rgb); });
  meteorSprite = makeMeteorSprite();

  now = last = performance.now() / 1000;
  bornAt = now;
  resize();
  stageStart = now + 0.25;

  // 调试入口：#instant 立即显示成型圣诞树
  if (location.hash.indexOf('instant') >= 0) {
    stageStart = now - 10;
    for (var q = 0; q < parts.length; q++) {
      var pp = parts[q], tt = treeT[q];
      if (!tt) continue;
      pp.tx = tt.x; pp.ty = tt.y; pp.tz = tt.z;
      pp.t0 = now - 10;
    }
  }

  requestAnimationFrame(render);

  // 开场淡入
  setTimeout(function () {
    var fd = document.getElementById('fade');
    if (fd) fd.className = 'fade out';
  }, 70);

  window.addEventListener('resize', function () {
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(resize, 220);
  });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 320); });

  // 防长按误触：仅短按且位移极小才重播
  var pDnX = 0, pDnY = 0, pDnT = 0;
  window.addEventListener('pointerdown', function (ev) {
    pDnX = ev.clientX; pDnY = ev.clientY; pDnT = now;
  }, { passive: true });
  window.addEventListener('pointerup', function (ev) {
    var mx = ev.clientX - pDnX, my = ev.clientY - pDnY;
    if (mx * mx + my * my < 484 && (now - pDnT) < 0.8) replay();
  }, { passive: true });
  window.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  window.addEventListener('keydown', function (ev) {
    if (ev.key === ' ' || ev.key === 'Enter') replay();
  });

  setTimeout(flashHint, 5200);
})();
</script>
</body>
</html>
